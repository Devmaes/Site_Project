name: IUSTE PHP portal checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3
      - name: PHP syntax checks
        run: find public src scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test business security and grades
        run: php tests/run.php
      - name: Verify JS syntax
        run: node --check public/assets/site.js


      - name: Verify root homepage navigation and content
        run: python3 tests/test_visible_homepage.py
